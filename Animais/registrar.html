<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Animal - Campus Pet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Campus Pet</h2>
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="registrar.html">Registrar</a>
        <a href="adocao.html">Adoção</a>
        <a href="orientacoes.html">Orientações</a>
    </nav>
</header>

<main>
    <h1>Encontrou um animal?</h1>

    <p>Preencha as informações abaixo.</p>

    <form id="reportForm">

        <label>Tipo de animal:</label>
        <select id="animal" required>
            <option value="">Selecione</option>
            <option>Cachorro</option>
            <option>Gato</option>
        </select>

        <label>Situação:</label>
        <select id="situation" required>
            <option value="">Selecione</option>
            <option>Visto no campus</option>
            <option>Parece perdido</option>
            <option>Precisa de atendimento</option>
        </select>

        <label>Local onde foi encontrado:</label>
        <input type="text" id="place" required>

        <label>Data e horário:</label>
        <input type="datetime-local" id="when" required>

        <label>Descrição:</label>
        <textarea id="details" required></textarea>

        <button type="submit">Enviar registro</button>

    </form>

    <div id="reportList"></div>
</main>

<footer>
    Campus Pet - Cuidar também é proteger.
</footer>

<script src="script.js"></script>
</body>
</html>
